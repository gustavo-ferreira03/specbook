services:
    app:
        image: ${SPECBOOK_IMAGE:-ghcr.io/gustavo-ferreira03/specbook:latest}
        shm_size: "1gb"
        restart: unless-stopped
        # Publish loopback for a local install; use deploy/docker-compose.caddy.yml
        # for shared HTTPS access. Model-provider OAuth callbacks stay on loopback
        # and can be forwarded over SSH from the browser's machine.
        ports:
            - "127.0.0.1:4000:4000"
            - "127.0.0.1:4001:4001"
            - "127.0.0.1:1455:1455"
            - "127.0.0.1:53692:53692"
        environment:
            HOST: 0.0.0.0
            FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
            SPECBOOK_BACKEND_URL: http://127.0.0.1:4000
            PI_OAUTH_CALLBACK_HOST: 0.0.0.0
            SPECBOOK_ALLOWED_HOSTS: ${SPECBOOK_ALLOWED_HOSTS:-}
            LOG_LEVEL: ${LOG_LEVEL:-info}
        volumes:
            - specbook-storage:/app/apps/backend/storage
        healthcheck:
            test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4000/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

volumes:
    specbook-storage:
