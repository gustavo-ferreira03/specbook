services:
    app:
        image: ${SPECBOOK_IMAGE:-ghcr.io/gustavo-ferreira03/specbook:latest}
        shm_size: "1gb"
        restart: unless-stopped
        ports:
            - "127.0.0.1:4000:4000"
            - "127.0.0.1:4001:4001"
            - "127.0.0.1:1455:1455"
            - "127.0.0.1:53692:53692"
        environment:
            FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
            SPECBOOK_ALLOWED_HOSTS: ${SPECBOOK_ALLOWED_HOSTS:-}
            PI_OAUTH_CALLBACK_HOST: 0.0.0.0
            LOG_LEVEL: ${LOG_LEVEL:-info}
        volumes:
            - specbook-storage:/app/apps/backend/storage

volumes:
    specbook-storage:
