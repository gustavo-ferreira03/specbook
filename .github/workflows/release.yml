name: Release CLI and UI

on:
    push:
        tags: ['v*']

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26
                  cache: pnpm
            - name: Check release version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node --input-type=module -e 'import fs from "node:fs"; const { version } = JSON.parse(fs.readFileSync("apps/cli/package.json", "utf8")); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag must match the CLI package version");'
            - run: pnpm install --frozen-lockfile
            - run: pnpm -r build
            - name: Package CLI and UI
              run: |
                  mkdir -p dist/release
                  pnpm --dir apps/cli pack --out ../../dist/release/specbook.tgz
                  node apps/frontend/scripts/package-ui.mjs dist/release
                  cd dist/release
                  sha256sum specbook.tgz > specbook.tgz.sha256
            - name: Attach release artifacts
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
                      gh release upload "$RELEASE_TAG" dist/release/* --clobber
                  else
                      gh release create "$RELEASE_TAG" dist/release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
                  fi
