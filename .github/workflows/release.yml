name: Release CLI and UI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const { version } = JSON.parse(fs.readFileSync("apps/cli/package.json", "utf8")); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag must match the CLI package version");'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @specbook/runtime --filter backend --filter frontend build
      - name: Package UI and embed its checksum in the CLI
        run: |
          mkdir -p dist/release
          node apps/frontend/scripts/package-ui.mjs dist/release
          export SPECBOOK_UI_RELEASE_SHA256="$(cut -d ' ' -f 1 dist/release/specbook-ui-*.tar.gz.sha256)"
          node apps/cli/scripts/package.mjs dist/release/specbook.tgz
          cd dist/release
          sha256sum specbook.tgz > specbook.tgz.sha256
      - name: Verify the installed release package
        timeout-minutes: 5
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          smoke_pid=""
          cleanup() {
            smoke_status=$?
            trap - EXIT
            if [ -n "$smoke_pid" ]; then
              kill "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" 2>/dev/null || true
            fi
            if [ "$smoke_status" -ne 0 ]; then cat "$smoke_dir/server.log" 2>/dev/null || true; fi
            rm -rf "$smoke_dir"
            exit "$smoke_status"
          }
          trap cleanup EXIT
          npm install --prefix "$smoke_dir/install" --ignore-scripts --omit=dev --no-audit --no-fund "$PWD/dist/release/specbook.tgz"
          smoke_cli="$smoke_dir/install/node_modules/.bin/specbook"
          test "$("$smoke_cli" --version)" = "${RELEASE_TAG#v}"
          mkdir "$smoke_dir/ui"
          tar -xzf "dist/release/specbook-ui-${RELEASE_TAG#v}.tar.gz" -C "$smoke_dir/ui"
          SPECBOOK_HOME="$smoke_dir/home" PORT=4820 "$smoke_cli" serve --ui "$smoke_dir/ui" --data "$smoke_dir/data" --host 127.0.0.1 --port 4821 > "$smoke_dir/server.log" 2>&1 &
          smoke_pid=$!
          smoke_deadline=$((SECONDS + 90))
          until [ "$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4821/api/health)" = 200 ] && [ "$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4821/)" = 200 ]; do
            kill -0 "$smoke_pid"
            if [ "$SECONDS" -ge "$smoke_deadline" ]; then echo "Installed Specbook did not become ready" >&2; exit 1; fi
            sleep 1
          done
          curl --fail --silent --max-time 30 http://127.0.0.1:4821/api/cli/specbook.tgz --output "$smoke_dir/served.tgz"
          tar -tzf "$smoke_dir/served.tgz" > "$smoke_dir/served-files"
          grep -Fxq 'package/node_modules/@earendil-works/pi-coding-agent/package.json' "$smoke_dir/served-files"
          grep -Fxq 'package/node_modules/@earendil-works/pi-ai/package.json' "$smoke_dir/served-files"
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
              gh release create "$RELEASE_TAG" dist/release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
