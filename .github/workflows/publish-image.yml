name: Publish Docker image

# Publishes a preview image for every commit on main that passes CI. The
# `latest` and version tags are reserved for releases (see release-please.yml).
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        steps:
            - id: commit
              env:
                  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
              run: |
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v7
              with:
                  ref: ${{ steps.commit.outputs.sha }}

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/specbook:main
                      ghcr.io/${{ github.repository_owner }}/specbook:sha-${{ steps.commit.outputs.short }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
