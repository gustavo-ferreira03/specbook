name: Specbook

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: specbook-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    specs:
        name: Run Specbook's own Specs
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26

            - uses: docker/setup-buildx-action@v3

            - name: Build the image under test
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  tags: specbook:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Restore the target instance from its fixture
              run: |
                  docker volume create specbook-target
                  docker run --rm -v specbook-target:/data -v "$PWD/specbook/fixtures:/fixtures:ro" \
                      --entrypoint node specbook:ci apps/backend/dist/operations-cli.js restore /fixtures/target.tar.gz

            - name: Start the target and the tester
              run: |
                  docker run -d --name specbook-target --network host -v specbook-target:/data \
                      -e PORT=5000 -e FRONTEND_PORT=5001 -e FRONTEND_ORIGIN=http://127.0.0.1:5001 specbook:ci
                  docker run -d --name specbook-tester --network host \
                      -e FRONTEND_ORIGIN=http://127.0.0.1:4001 specbook:ci

            - name: Run the Specs
              env:
                  SPECBOOK_JUNIT_PATH: specbook-junit.xml
                  SPECBOOK_SUMMARY_PATH: specbook-summary.md
              run: node specbook/ci.mjs

            - name: Publish the summary
              if: always()
              run: |
                  test -f specbook-summary.md && cat specbook-summary.md >> "$GITHUB_STEP_SUMMARY" || true
                  test -f specbook-report.html && echo "The full report with each Spec's steps and screenshots is in the **specbook-report** artifact (specbook-report.html)." >> "$GITHUB_STEP_SUMMARY" || true

            - name: Show container logs
              if: failure()
              run: |
                  docker logs specbook-tester 2>&1 | tail -n 200
                  docker logs specbook-target 2>&1 | tail -n 200

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: specbook-report
                  path: |
                      specbook-report.html
                      specbook-junit.xml
                      specbook-summary.md
                  if-no-files-found: ignore
