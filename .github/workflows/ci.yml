name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Reads the pnpm version from package.json's packageManager field.
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 26
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Type-check
              run: pnpm typecheck

            - name: Build
              run: pnpm build

            - name: Install display and storage tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends xvfb x11vnc util-linux

            - name: Install both Chromium builds and system dependencies
              run: pnpm --filter backend browser:install:docker

            - name: Test including browser safety and VNC ownership
              env:
                  SPECBOOK_TEST_VNC: '1'
              run: pnpm -r --if-present test
