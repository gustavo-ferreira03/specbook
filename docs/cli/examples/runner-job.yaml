apiVersion: batch/v1
kind: Job
metadata:
  name: specbook-runner-once
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      containers:
        - name: runner
          image: specbook-runner:YOUR_VERSION
          args: ["--once", "--json"]
          env:
            - name: SPECBOOK_URL
              value: https://specbook.example.com/api
            - name: SPECBOOK_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: specbook-runner
                  key: token
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          volumeMounts:
            - name: browser-shm
              mountPath: /dev/shm
      volumes:
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
